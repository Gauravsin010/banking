<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Account Details</title>
    <style>
table, th, td {
  border: 1px solid black;
}
</style>
    <link th:href="@{/styles/styles.css}" rel="stylesheet" />
</head>
<body>
<header>
    <nav class="navbar">
        <div class="nav-brand">Service Page</div>
        <ul class="nav-links">
            <li><a th:href="@{/}">Home</a></li>
<!--            <li><a href="#home">Home</a></li>-->
            <li><a href="#about">About</a></li>
<!--            <li><a th:href="@{/getAccountsDetailsWeb}">Services</a></li>-->
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>
</header>

<!--<h1>Gaurav Bank</h1>-->
<h2> Customer Account Details </h2>
<table class="table table-striped table-hover table-bordered" style="width:100%">
  <thead class="table-dark">
  <tr>
      <th> Account No </th>
      <th> First Name </th>
      <th> Last Name </th>
      <th> Address </th>
      <th> Balance </th>
      <th> Account Type </th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="customer : ${customers}">
      <td th:text="${customer.accountNo}"></td>
      <td th:text="${customer.firstName}"></td>
      <td th:text="${customer.lastName}"></td>
      <td th:text="${customer.address}"></td>
      <td th:text="${customer.balance}"></td>
      <td th:text="${customer.accountType}"></td>
  </tr>
  </tbody>

</table>

<footer>
    <nav class="footer-nav">
        <ul>
            <li><a href="#terms">Terms</a></li>
            <li><a href="#privacy">Privacy Policy</a></li>
            <li><a href="#help">Help</a></li>
        </ul>
    </nav>
</footer>
</body>
</html>
